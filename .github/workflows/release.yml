name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "manifest.json"
      - "**.md"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Check formatting
        run: dotnet format --verify-no-changes
      - name: Build (strict)
        run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true
      - name: Run unit tests with coverage
        run: |
          dotnet test Jellyfin.Plugin.SmartCollections.Tests/Jellyfin.Plugin.SmartCollections.Tests.csproj \
            --configuration Release \
            --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=json \
            /p:CoverletOutput=../coverage/coverage.json \
            /p:Include="[Jellyfin.Plugin.SmartCollections]*" \
            /p:ThresholdType=line \
            /p:Threshold=80
      - name: Run acceptance tests
        run: |
          dotnet test Jellyfin.Plugin.SmartCollections.AcceptanceTests/Jellyfin.Plugin.SmartCollections.AcceptanceTests.csproj \
            --configuration Release \
            --no-build
      - name: CRAP score check
        run: bash scripts/check-crap.sh coverage/coverage.json

  build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get next version
      id: get_version
      run: |
        # Get latest tag, default to 0.0.0.0 if none
        LATEST=$(git tag --sort=-v:refname | head -1)
        if [ -z "$LATEST" ]; then
          LATEST="0.0.0.0"
        fi
        # Bump the last segment
        NEXT=$(echo "$LATEST" | awk -F. '{$NF=$NF+1; print}' OFS=.)
        echo "VERSION=$NEXT" >> $GITHUB_OUTPUT
        echo "Next version: $NEXT"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Jellyfin.Plugin.SmartCollections.sln

    - name: Build
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        dotnet build Jellyfin.Plugin.SmartCollections.sln \
          --configuration Release --no-restore \
          /p:TreatWarningsAsErrors=false \
          /p:Version=$VERSION \
          /p:AssemblyVersion=$VERSION \
          /p:FileVersion=$VERSION

    - name: Create release zip
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        mkdir -p release
        cp Jellyfin.Plugin.SmartCollections/bin/Release/net10.0/Jellyfin.Plugin.SmartCollections.dll release/
        cd release
        zip -r ../jellyfin-plugin-smart-collections-${VERSION}.zip .

    - name: Calculate checksum
      id: calculate_checksum
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        CHECKSUM=$(md5sum jellyfin-plugin-smart-collections-${VERSION}.zip | awk '{ print $1 }')
        echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT

    - name: Update manifest.json
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        CHECKSUM=${{ steps.calculate_checksum.outputs.CHECKSUM }}
        # manifest.json from the checkout (git) is the source of truth; the
        # script prepends the new entry and never rewrites historical ones.
        python3 scripts/update-manifest.py \
          --version "${VERSION}" \
          --checksum "${CHECKSUM}" \
          --source-url "https://github.com/${{ github.repository }}/releases/download/${VERSION}/jellyfin-plugin-smart-collections-${VERSION}.zip" \
          --changelog "https://github.com/${{ github.repository }}/releases/tag/${VERSION}"

    - name: Validate manifest.json
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        python3 scripts/validate-manifest.py \
          --new-version "${VERSION}" \
          --zip "jellyfin-plugin-smart-collections-${VERSION}.zip"

    - name: Create tag and GitHub Release
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$VERSION"
        git push origin "$VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        files: |
          jellyfin-plugin-smart-collections-${{ steps.get_version.outputs.VERSION }}.zip
          manifest.json
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify published release asset matches manifest
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        SOURCE_URL=$(python3 -c "import json,sys; m=json.load(open('manifest.json')); e=[v for v in m[0]['versions'] if v['version']=='${VERSION}'][0]; print(e['sourceUrl'])")
        EXPECTED=$(python3 -c "import json,sys; m=json.load(open('manifest.json')); e=[v for v in m[0]['versions'] if v['version']=='${VERSION}'][0]; print(e['checksum'])")
        echo "Downloading published asset: ${SOURCE_URL}"
        for attempt in 1 2 3 4 5; do
          if curl -fsSL "${SOURCE_URL}" -o published-asset.zip; then
            break
          fi
          echo "Attempt ${attempt} failed; retrying in 10s..."
          sleep 10
        done
        ACTUAL=$(md5sum published-asset.zip | awk '{ print $1 }')
        echo "Expected md5: ${EXPECTED}"
        echo "Actual md5:   ${ACTUAL}"
        if [ "${ACTUAL}" != "${EXPECTED}" ]; then
          echo "ERROR: published asset checksum does not match manifest entry"
          exit 1
        fi

    - name: Update manifest on main
      run: |
        git fetch origin main
        git checkout main
        git add manifest.json
        git diff --cached --quiet || git commit -m "chore: update manifest for ${{ steps.get_version.outputs.VERSION }}"
        git push origin main
